[package]
name = "openrouter"
version = "0.1.0"
description = "Native OpenRouter chat and routing client for Kujo with an AI SDK driver."
license = "MIT"
repository = "https://github.com/kujolang/openrouter"
readme = "README.md"
[package.status]
stage = "experimental"
stability = "early"
public_api = true
[kujo]
minimum_version = "1.0.2"
entry = "openrouter.kujo"
sources = ["src", "."]
includes = ["README.md", "CHANGELOG.md", "tests", "AGENTS.md", "OPENROUTER_IMPLEMENTATION_REPORT.md", "OPENROUTER_PROVIDER_PACKAGE_CONFORMANCE.md"]
excludes = [".git", "dist", "build", "kennel_packages"]
[dependencies]
ai-sdk = { source = "github:kujolang/ai-sdk", ref = "v1.1.0" }
[scripts]
test = "bash scripts/release_quality_gate.sh"
verify-offline = "bash scripts/release_quality_gate.sh"
[package.exports]
openrouter = "src/openrouter.kujo"
provider = "src/provider.kujo"
